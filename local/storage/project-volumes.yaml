#    project: theory
#    storageClass: weka-projects
#    size: 2Ti
#    accessMode: ReadWriteMany
#    mountPath: /work
#
#  # The same on CephFS, one subvolume per project
#  - name: scratch
#    projects: [theory, cosmology]
#    storageClass: cephfs-projects
#    size: 500Gi
#    mountPath: /scratch
#
#  # An existing, read-only dataset directory on Weka, shared by two projects
#  - name: imagenet
#    projects: [theory, vision]
#    existing: {driver: weka, filesystem: datasets, path: /imagenet}
#    size: 10Ti
#    readOnly: true
#    mountPath: /datasets/imagenet
#
#  # A group's existing directory on CephFS (kernel client)
#  - name: group-share
#    project: cosmology
#    existing: {driver: cephfs, path: /volumes/groups/cosmology}
#    size: 5Ti
