# Interactive service: JupyterLab as yourself, with your home, reachable
#   - inside the cluster:   http://jupyter-lperez.<namespace>.svc:8888
#   - from your laptop:     runai workload port-forward ... (see the guide)
#   - from a browser:       https://jupyter-lperez.runai.htd.local (Ingress)
# Several documents in one file are submitted as one workload.
#   runai workload submit -f 05-jupyter-service.yaml -p <project>
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jupyter-lperez                    # CHANGE ME (unique per project)
spec:
  replicas: 1
  selector:
    matchLabels: {app: jupyter-lperez}
  template:
    metadata:
      labels: {app: jupyter-lperez}
    spec:
      securityContext:
        runAsUser: 5102                   # CHANGE ME: id -u
        runAsGroup: 5100                  # CHANGE ME: id -g
        supplementalGroups: [100]         # "users" group of the Jupyter image
      containers:
        - name: jupyter
          image: 10.10.172.1:5001/workloads/jupyter-scipy:2026-10-28
          workingDir: /home/lperez                              # CHANGE ME
          command: ["jupyter", "lab"]
          args:
            - --ip=0.0.0.0
            - --port=8888
            - --no-browser
            - --ServerApp.root_dir=/home/lperez               # CHANGE ME
            - --IdentityProvider.token=$(JUPYTER_TOKEN)
          env:
            - {name: HOME, value: /home/lperez}               # CHANGE ME
            - {name: JUPYTER_TOKEN, value: change-me-to-a-long-random-string}
          ports:
            - {name: http, containerPort: 8888}
          readinessProbe:
            httpGet: {path: /api, port: http}
          resources:
            requests: {cpu: 500m, memory: 2Gi}
            limits:   {cpu: "2", memory: 4Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: jupyter-lperez
spec:
  selector: {app: jupyter-lperez}
  ports:
    - {name: http, port: 8888, targetPort: http}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jupyter-lperez
spec:
  ingressClassName: traefik
  rules:
    - host: jupyter-lperez.runai.htd.local                  # <anything>.runai.htd.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: jupyter-lperez, port: {name: http}}
