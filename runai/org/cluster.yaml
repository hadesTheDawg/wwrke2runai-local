# Site definition in Slurm terms, applied to Run:ai + Linux by
#   40-partitions.sh   partitions -> Warewulf node tags, node labels,
#                      (simulated) GPU types, Run:ai node pools
#   41-accounts.sh     accounts   -> Run:ai departments/projects + quotas,
#                      Unix groups/users (homes on NFS /home), Run:ai
#                      users with passwords, UID/GID claims, access rules
#
# Slurm                         -> here / Run:ai
#   PartitionName=... Nodes=...  partitions.<name>.nodes  -> node pool (label runai/node-pool=<name>)
#   sacctmgr account (parent)    departments.<name>       -> department
#   sacctmgr account (leaf)      groups.<name>            -> project + Unix group (gid)
#   GrpTRES=gres/gpu:N           gpus.<partition>: N      -> deserved (guaranteed) GPUs
#   MaxTRES / GrpTRES ceiling    limit.<partition>: N     -> GPU limit (max incl. over-quota)
#   Fairshare                    weight                   -> over-quota weight
#   account coordinator          pi                       -> Project administrator
#   sacctmgr user/association    users (login: Full Name) -> AI practitioner (via group)
#
# Totals must fit the partitions: a100 = 4 GPUs (2 nodes x 2), h100 = 2 GPUs.

partitions:
  a100:
    nodes: [htdcn01, htdcn02]
    gpu: {product: NVIDIA-A100-SXM4-40GB, count: 2, memoryMiB: 40960}
  h100:
    nodes: [htdcn03]
    gpu: {product: NVIDIA-H100-80GB-HBM3, count: 2, memoryMiB: 81920}

# Slurm "Default=YES": where workloads go when the user picks no node pool
# (Run:ai defaultNodePools, inherited department -> project; a department or
# group may set its own `default_partitions`). Keeps research workloads off
# the management node (Run:ai pool "default" = ww1).
default_partitions: [a100, h100]

uid_base: 5000        # group k: gid = uid_base + 100*k, members uid = gid + 1..99
email_domain: htd.local

